    /* ============================ DE bracket mode =============================
       The session carries only the seeded qualifier list (slot i = seed i+1);
       the bracket itself is rebuilt here with the same standard-seeding
       algorithm the desktop uses, then submitted bouts (slot pairs) advance
       winners. Byes fill non-power-of-2 fields, top seeds get them. */
    function standardSeeding(n){
        let size=2; while(size<n) size*=2;
        const rounds=Math.log2(size);
        let seq=[1,2];
        for(let r=1;r<rounds;r++){
            const next=[], sum=Math.pow(2,r+1)+1;
            seq.forEach(s=>{ next.push(s, sum-s); });
            seq=next;
        }
        return { size, seq };
    }
    function buildDEModel(){
        const n=ROSTER.length;
        const { size, seq } = standardSeeding(n);
        const numRounds=Math.round(Math.log2(size));
        const rounds=[];
        let m=size/2;
        for(let r=0;r<numRounds;r++){
            rounds.push(Array.from({length:m},()=>({ slots:[null,null], scores:null, winner:null })));
            m=Math.max(1,m/2);
        }
        for(let i=0;i<size/2;i++){
            const s1=seq[i*2], s2=seq[i*2+1];
            rounds[0][i].slots=[ s1<=n? s1-1:null, s2<=n? s2-1:null ];
        }
        for(let r=0;r<numRounds;r++){
            rounds[r].forEach((match,mi)=>{
                const A=match.slots[0], B=match.slots[1];
                if(A==null && B==null) return;
                let winner=null;
                if(A!=null && B==null){ if(r===0) winner=A; }        // opening bye
                else if(A==null && B!=null){ if(r===0) winner=B; }   // later rounds: TBD feeder
                else{
                    const sub=boutMap[Math.min(A,B)+'-'+Math.max(A,B)];
                    if(sub){
                        const aIsFirst = Math.min(A,B)===A;
                        match.scores=[ aIsFirst?sub.a_score:sub.b_score, aIsFirst?sub.b_score:sub.a_score ];
                        winner = (sub.victor_slot===A||sub.victor_slot===B) ? sub.victor_slot
                               : (match.scores[0]>match.scores[1] ? A : B);
                    }
                }
                match.winner=winner;
                if(winner!=null && r<numRounds-1) rounds[r+1][Math.floor(mi/2)].slots[mi%2]=winner;
            });
        }
        return { size, numRounds, rounds };
    }
    function roundTitle(matches){
        const t=matches*2;
        return t===2 ? 'Final' : (t===4 ? 'Semifinals' : 'Table of '+t);
    }
    function roundShort(matches){
        const t=matches*2;
        return t===2 ? 'Final' : (t===4 ? 'Semis' : 'T'+t);
    }
    function deReadyMatches(model){
        const out=[];
        model.rounds.forEach((round,r)=>{
            round.forEach(match=>{
                if(match.slots[0]!=null && match.slots[1]!=null && !match.scores){
                    out.push({ r, a:match.slots[0], b:match.slots[1], round:roundShort(round.length) });
                }
            });
        });
        return out;
    }
    function deMatchLabel(a,b){
        const model=buildDEModel();
        for(const round of model.rounds){
            for(const match of round){
                const s=match.slots;
                if((s[0]===a&&s[1]===b)||(s[0]===b&&s[1]===a)) return roundTitle(round.length);
            }
        }
        return 'Direct Elimination';
    }
    function renderDE(){
        const model=buildDEModel();
        const cols=model.rounds.map((round,r)=>{
            const cards=round.map(match=>{
                const ready=match.slots[0]!=null && match.slots[1]!=null && !match.scores;
                const lines=[0,1].map(side=>{
                    const s=match.slots[side];
                    const other=match.slots[1-side];
                    const isBye = r===0 && s==null && other!=null;
                    const nm = s!=null ? esc(rosterLabel(s)) : (isBye ? 'Bye' : 'TBD');
                    const phCls = s==null ? ' is-placeholder' : '';
                    const seed = s!=null ? (s+1) : '';
                    const sc = match.scores!=null ? match.scores[side] : '';
                    const winCls = (match.scores!=null && match.winner===s) ? ' is-winner' : '';
                    return `<div class="de-line${winCls}"><span class="de-seed">${seed}</span><span class="de-name${phCls}">${nm}</span><span class="de-mscore">${sc}</span></div>`;
                }).join('');
                const readyAttrs = ready ? ` role="button" tabindex="0" data-de-a="${match.slots[0]}" data-de-b="${match.slots[1]}" title="Referee this match"` : '';
                return `<div class="de-match${ready?' is-ready':''}"${readyAttrs}>${lines}</div>`;
            }).join('');
            return `<div class="de-col"><div class="de-col-title">${roundTitle(round.length)}</div>${cards}</div>`;
        }).join('');
        const weapon=SESSION.weapon ? String(SESSION.weapon).trim() : '';
        stage.innerHTML=`
            <div class="ref-content is-de">
            <div class="ref-pool-caption">
                <span>Direct Elimination</span>
                ${weapon?`<span class="sep">·</span><span>${esc(weapon)}</span>`:''}
                <span class="sep">·</span><span>${roundTitle(model.rounds[0].length)}</span>
                <span class="sep">·</span><span>${ROSTER.length} fencer${ROSTER.length===1?'':'s'}</span>
            </div>
            <div class="panel">
                <div class="seeding-pool-rail">
                    <span class="seeding-pool-rail-num" title="Direct Elimination">DE</span>
                    <span class="seeding-strip-trigger" title="Bracket size">${model.size}</span>
                </div>
                <div class="seeding-pool-main">
                    <div class="panel-content">
                        <div class="de-scroll"><div class="de-cols">${cols}</div></div>
                    </div>
                </div>
            </div>
            <div class="pool-widgets" id="ref-widgets"></div>
            </div>`;
        stage.querySelectorAll('.de-match.is-ready').forEach(el=>{
            const go=()=>{ openTimer(+el.dataset.deA, +el.dataset.deB); };
            el.addEventListener('click', go);
            el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
        });
        renderDEWidgets(model);
    }
    /* Overall leaderboard: champion first, then still-in fencers by furthest
       round, then eliminated by how deep they got. W counts fenced wins only
       (byes advance but don't score a win). */
    function deStandings(model){
        const stat=ROSTER.map((f,i)=>({ slot:i, name:rosterLabel(i), w:0, reached:0, alive:true, out:null }));
        model.rounds.forEach((round,r)=>{
            round.forEach(match=>{
                const A=match.slots[0], B=match.slots[1];
                [A,B].forEach(s=>{ if(s!=null && stat[s]) stat[s].reached=Math.max(stat[s].reached,r); });
                if(match.winner!=null && match.scores!=null){
                    stat[match.winner].w++;
                    const loser = match.winner===A ? B : A;
                    if(loser!=null && stat[loser]){ stat[loser].alive=false; stat[loser].out=r; }
                }
            });
        });
        const finalMatch=model.rounds[model.numRounds-1][0];
        const champ=(finalMatch && finalMatch.scores!=null) ? finalMatch.winner : null;
        stat.forEach(s=>{
            s.isChamp = champ!=null && s.slot===champ;
            s.label = s.isChamp ? 'Champion'
                : s.alive ? roundShort(model.rounds[s.reached].length)
                : 'Out · '+roundShort(model.rounds[s.out].length);
        });
        stat.sort((x,y)=>{
            if(x.isChamp!==y.isChamp) return x.isChamp?-1:1;
            if(x.alive!==y.alive) return x.alive?-1:1;
            const xr=x.alive?x.reached:x.out, yr=y.alive?y.reached:y.out;
            if(xr!==yr) return yr-xr;
            if(x.w!==y.w) return y.w-x.w;
            return x.slot-y.slot;
        });
        return { stat, champ };
    }
    function renderDEWidgets(model){
        const host=document.getElementById('ref-widgets'); if(!host) return;
        const { stat, champ }=deStandings(model);
        const anyPlayed=stat.some(s=>s.w>0) || stat.some(s=>!s.alive);
        const rows=stat.slice(0, Math.min(8, stat.length)).map((s,rank)=>{
            const isTop=rank===0 && (champ!=null || anyPlayed);
            const medal=rank<3?`pool-lb-rank-${rank+1}`:'';
            const rankMark=(s.isChamp||isTop&&champ!=null)? svgIcon(ICON.crown,'pool-lb-rank-crown') : String(rank+1);
            return `<li class="pool-lb-row${s.isChamp?' is-leader':''}"><span class="pool-lb-rank ${medal}">${rankMark}</span><span class="pool-lb-main"><span class="pool-lb-name">${esc(s.name)}</span></span><span class="pool-lb-stat pool-lb-v">${s.w}<small>W</small></span><span class="pool-lb-stat pool-lb-ind">${esc(s.label)}</span></li>`;
        }).join('');
        const board=anyPlayed?`<ol class="pool-leaderboard">${rows}</ol>`:`<p class="pool-lb-empty">Score DE bouts to see the leaders emerge.</p>`;
        host.innerHTML=`<section class="pool-widget pool-widget-leaderboard"><div class="pool-widget-rail"><div class="pool-widget-rail-icons">${svgIcon(ICON.trend)}</div><span class="pool-widget-rail-label">Overall Leaderboard</span></div><div class="pool-widget-main"><div class="pool-widget-body${anyPlayed?'':' pool-widget-body-empty'}">${board}</div></div></section>`;
    }
    /* DE picker: a tap-list of every ready match, instead of the pools' two
       dropdowns — "what match are you refereeing?" */
    function openDEMatchPicker(){
        const model=buildDEModel();
        const ready=deReadyMatches(model);
        if(!ready.length){
            const finalMatch=model.rounds[model.numRounds-1][0];
            toast(finalMatch && finalMatch.scores ? 'Bracket complete ✓' : 'No matches ready yet', !(finalMatch&&finalMatch.scores));
            pageMode='pools'; syncPageChrome(); return;
        }
        const ov=document.createElement('div'); ov.className='ref-overlay';
        ov.innerHTML=`
            <div class="ref-overlay-back" data-close></div>
            <div class="ref-sheet-wrap"><div class="ref-sheet">
                <div class="ref-sheet-head"><span>What match are you refereeing?</span><span class="x" data-close>✕</span></div>
                <div class="ref-sheet-body">
                    <div class="de-pick-list">
                        ${ready.map(mt=>`<button type="button" class="de-pick" data-a="${mt.a}" data-b="${mt.b}"><span class="de-pick-round">${esc(mt.round)}</span><span class="de-pick-names">${esc(rosterLabel(mt.a))} vs ${esc(rosterLabel(mt.b))}</span></button>`).join('')}
                    </div>
                    <div class="ref-btn-row">
                        <button class="rbtn rbtn-danger" data-close>Cancel</button>
                    </div>
                </div>
            </div></div>`;
        ov.querySelectorAll('.de-pick').forEach(btn=> btn.addEventListener('click', ()=>{
            closeOverlay(ov); openTimer(+btn.dataset.a, +btn.dataset.b);
        }));
        ov.querySelectorAll('[data-close]').forEach(x=> x.addEventListener('click', ()=>{
            closeOverlay(ov);
            if(!timerEl){ pageMode='pools'; syncPageChrome(); }
        }));
        showOverlay(ov);
    }

    /* ============================ Post-completion lock ========================
       Once every bout in the pool is recorded, the referee keeps read-only
       access for a short window (to double-check anything), then the page
       locks down for good — no more editing, no more data on screen. The
       completion timestamp is persisted so the clock survives a reload and
       can't be reset by just refreshing the page. */
    const VIEW_MODE_MS = 10 * 60 * 1000;
    let lockTimer = null;
    function lockKey(){ return 'refapp.lock.' + SESSION_ID; }
    function getLockState(){ try{ return JSON.parse(localStorage.getItem(lockKey())||'null'); }catch(e){ return null; } }
    function setLockState(state){ try{ localStorage.setItem(lockKey(), JSON.stringify(state)); }catch(e){} }

    function applyViewModeUI(isView){
        stage.querySelectorAll('.score-input').forEach(inp=>{ inp.readOnly = isView; });
        const footer = document.querySelector('.ref-footer');
        if(footer) footer.style.display = isView ? 'none' : '';
    }

    function showLockedScreen(){
        if(lockTimer){ clearTimeout(lockTimer); lockTimer=null; }
        if(typeof timerState !== 'undefined' && timerState && timerState.tick){ clearInterval(timerState.tick); }
        document.body.innerHTML = '<div class="ref-locked"><div class="ref-locked-msg">Thank you for scoring!</div></div>';
    }

    /* Pools: every bout recorded. DE: the final has been fenced and won. */
    function isSessionComplete(){
        if(!ROSTER.length) return false;
        if(IS_DE){
            const model=buildDEModel();
            const finalMatch=model.rounds[model.numRounds-1][0];
            return !!(finalMatch && finalMatch.scores!=null && finalMatch.winner!=null);
        }
        const comp = computeCompletion();
        return comp.total>0 && comp.left===0;
    }

    /* Checks/arms the lock clock. Returns true if the page is now permanently
       locked (callers should stop doing anything else once this fires). */
    function checkPoolCompletionLock(){
        let state = getLockState();
        let justCompleted = false;
        if(!state && isSessionComplete()){
            state = { completedAt: Date.now() };
            setLockState(state);
            justCompleted = true;
        }
        if(!state){ applyViewModeUI(false); return false; }
        const elapsed = Date.now() - state.completedAt;
        if(elapsed >= VIEW_MODE_MS){ showLockedScreen(); return true; }
        applyViewModeUI(true);
        if(justCompleted) toast((IS_DE?'Bracket complete':'Pool complete')+' — view only for 10 minutes');
        if(lockTimer) clearTimeout(lockTimer);
        lockTimer = setTimeout(checkPoolCompletionLock, VIEW_MODE_MS - elapsed + 250);
        return false;
    }
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkPoolCompletionLock(); });

    /* ---- widget palette (mirrors the director's screen) ----
       The desktop publishes whichever palette it is running and pushes changes
       to live sessions, so this follows along instead of being decided here.
       'standard' is the default and means no palette at all — the widgets keep
       the app's own glass, exactly like the desktop's standard setting. A ?wp=
       in the QR link overrides, which is the way to test one without touching
       the director's settings. */
    const PALETTES = ['standard','matcha','onyx','cobalt','ember'];
    const PALETTE_POLL_MS = 15000;
    let palettePollTimer = null;
    function applyWidgetPalette(next){
        const urlOverride = params.get('wp');
        const want = PALETTES.includes(urlOverride) ? urlOverride
                   : (PALETTES.includes(String(next||'')) ? String(next) : 'standard');
        if(document.documentElement.getAttribute('data-widget-palette') === want) return;
        document.documentElement.setAttribute('data-widget-palette', want);
    }
    function startPalettePoll(){
        if(palettePollTimer || params.get('wp')) return;
        palettePollTimer = setInterval(async ()=>{
            /* Palette only — the roster and the scores are deliberately left
               alone, so a poll can never overwrite what a referee is typing. */
            try{
                const data = await rpc('session_get', { p_session_id:SESSION_ID, p_token:TOKEN });
                if(data) applyWidgetPalette(data.widgetPalette);
            }catch(e){ /* offline or older database — keep the current palette */ }
        }, PALETTE_POLL_MS);
    }

    /* ---- boot ---- */
    async function load(){
        if(checkPoolCompletionLock()) return; // already permanently locked from a prior visit
        if(!SESSION_ID || !TOKEN){ stateCard('Invalid link', 'This QR is missing its session or token.'); return; }
        if(SUPABASE_URL.includes('YOUR-PROJECT')){ stateCard('Not configured yet', 'Set SUPABASE_URL and the anon key in this page before hosting.'); return; }
        try{
            const data = await rpc('session_get', { p_session_id:SESSION_ID, p_token:TOKEN });
            SESSION = data || {};
            IS_DE = (typeof SESSION.poolIndex === 'number' && SESSION.poolIndex < 0)
                 || /elimination/i.test(String(SESSION.poolLabel||''));
            applyWidgetPalette(SESSION.widgetPalette);
            startPalettePoll();
            ROSTER = Array.isArray(SESSION.roster) ? SESSION.roster.slice().sort((a,b)=>(a.slot||0)-(b.slot||0)) : [];
            boutMap = {};
            (SESSION.bouts||[]).forEach(b=>{ boutMap[b.a_slot+'-'+b.b_slot]=b; });
            if(!ROSTER.length){ stateCard(IS_DE?'Empty bracket':'Empty pool', 'Nothing was published for this session yet.'); return; }
            if(IS_DE) renderDE(); else render();
            checkPoolCompletionLock();
        }catch(err){
            stateCard('Could not load', err.message || 'Check your connection and try again.');
        }
    }

    /* ============================ Bout timer flow ============================ */
    const BOUT_SECS = 180;
    /* Touch cap is weapon-independent: pools are to 5, DE to 15 for foil,
       épée AND sabre. What differs by weapon in DE is the CLOCK structure. */
    function touchCap(){ return IS_DE ? 15 : 5; }
    /* Per-weapon DE bout formats:
         Foil / Épée — three 3:00 periods (9 min max), to 15.
         Sabre       — to 15 with a break when a fencer reaches 8 touches.
       Pools are one 3:00 period to 5 for every weapon. */
    const DE_WEAPONS = {
        epee:  { key:'epee',  label:'Épée',  periods:3, periodSecs:180, breakAt:null },
        foil:  { key:'foil',  label:'Foil',  periods:3, periodSecs:180, breakAt:null },
        sabre: { key:'sabre', label:'Sabre', periods:2, periodSecs:180, breakAt:8 }
    };
    const POOL_FORMAT = { key:'pool', label:'Pool', periods:1, periodSecs:180, breakAt:null };
    function normWeapon(w){
        const s = String(w||'').toLowerCase();
        if(/sab/.test(s)) return 'sabre';
        if(/fo/.test(s)) return 'foil';
        return 'epee';
    }
    function defaultDEFormat(){ return DE_WEAPONS[normWeapon(SESSION && SESSION.weapon)] || DE_WEAPONS.epee; }
    let timerState = null;
    let timerEl = null;
    let pageMode = 'pools'; /* 'pools' | 'bout' */

    const stageEl = document.getElementById('ref-stage');
    const timerBtn = document.getElementById('timer-btn');

    function syncPageChrome(){
        if(timerBtn){
            /* Two jobs, and which one it is depends on where you are: on the
               pool sheet it starts a bout, and on the bout it goes back to the
               pool sheet. It used to say "Back to Bout" while you were already
               on the bout, which was a no-op sitting next to Cancel. Red on the
               bout screen, because leaving is the destructive direction. */
            const onBout = pageMode === 'bout' && !!timerEl;
            const parked = !onBout && !!timerEl;
            timerBtn.classList.toggle('is-active', onBout);
            timerBtn.classList.toggle('is-back', onBout);
            timerBtn.querySelector('span').textContent =
                onBout ? 'Back to Home' : (parked ? 'Back to Bout' : 'Ref a Bout');
            timerBtn.title =
                onBout ? 'Back to the pool sheet' : (parked ? 'Return to the bout in progress' : 'Ref a bout');
        }
        if(stageEl) stageEl.classList.toggle('is-hidden', pageMode === 'bout' && !!timerEl && !timerEl.classList.contains('is-parked'));
    }

    function setPage(mode){
        if(mode !== 'pools' && mode !== 'bout') return;
        pageMode = mode;
        if(mode === 'pools'){
            if(timerEl){
                timerEl.classList.add('is-parked');
                timerEl.classList.remove('open');
            }
            if(stageEl) stageEl.classList.remove('is-hidden');
            syncPageChrome();
            return;
        }
        /* bout page */
        if(timerEl){
            timerEl.classList.remove('is-parked');
            timerEl.classList.add('open');
            if(stageEl) stageEl.classList.add('is-hidden');
            syncPageChrome();
            return;
        }
        /* no active bout yet — pick first, land on bout once timer starts */
        pageMode = 'pools';
        syncPageChrome();
        openBoutPicker();
    }

    /* ---- dark / light switch ---- */
    const MODE_KEY = 'vantage-ref-mode';
    const modeSwitch = document.getElementById('mode-switch');
    function applyMode(mode){
        const light = mode === 'light';
        document.documentElement.setAttribute('data-mode', light ? 'light' : 'dark');
        /* The onyx-smoke photo is a dark-room backdrop; light mode drops it for
           a plain light field rather than fighting it with a wash. */
        document.body.setAttribute('data-vantage-background', light ? 'light' : 'onyx-smoke');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f2f5f9' : '#000000');
        if(modeSwitch){
            modeSwitch.setAttribute('aria-checked', light ? 'true' : 'false');
            modeSwitch.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
        }
        try{ localStorage.setItem(MODE_KEY, light ? 'light' : 'dark'); }catch(e){}
    }
    if(modeSwitch){
        modeSwitch.addEventListener('click', ()=>{
            applyMode(document.documentElement.getAttribute('data-mode') === 'light' ? 'dark' : 'light');
        });
    }
    (function initMode(){
        let stored = null;
        try{ stored = localStorage.getItem(MODE_KEY); }catch(e){}
        if(stored !== 'light' && stored !== 'dark'){
            stored = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        applyMode(stored);
    })();

    function showOverlay(el){ document.body.appendChild(el); requestAnimationFrame(()=> el.classList.add('open')); }
    function closeOverlay(el){ el.classList.remove('open'); setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 220); }

    function boutScored(i,j){ const a=cellInput(i,j), b=cellInput(j,i); return !!(a&&b&&a.value.trim()!==''&&b.value.trim()!==''); }
    function fencerDone(i){ return ROSTER.every((_,j)=> j===i || boutScored(i,j)); }
    function firstUnscoredBout(){ const n=ROSTER.length; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) if(!boutScored(i,j)) return {a:i,b:j}; return null; }
    /* Two fencers can share the exact same name (duplicate registration,
       common name). Tag the ones that collide with the same pool-sheet #
       the ref already sees in the leftmost column, so picker/timer/confirm
       never show two identical, unpickable labels. */
    function rosterName(i){ const f=ROSTER[i]; return (f&&f.name)||('Fencer '+(i+1)); }
    function rosterSeed(i){ const f=ROSTER[i]; return (f&&f.seed!=null)? f.seed : (i+1); }
    function rosterLabel(i){
        const name = rosterName(i);
        const dup = ROSTER.some((_,j)=> j!==i && rosterName(j)===name);
        return dup ? `${name} (#${rosterSeed(i)})` : name;
    }
    /* Both picker boxes show the SAME list: every fencer who still has at
       least one unscored bout. No pair-dependent filtering — picking a left
       name never hides the right name you're looking for. (Re-picking an
       already-scored pairing is allowed; sending it again simply overwrites
       that bout, which doubles as the correction path.) */
    function availableOptions(){ return ROSTER.map((f,i)=>({i,name:rosterLabel(i)})).filter(o=> !fencerDone(o.i)); }

    /* --- Step 1: pick who is fencing (only unscored pairings offered) --- */
    function openBoutPicker(){
        if(!ROSTER.length){ toast(IS_DE?'Load a bracket first':'Load a pool first', true); return; }
        if(IS_DE){ openDEMatchPicker(); return; }
        if(!availableOptions().length){ toast('All bouts recorded ✓'); pageMode='pools'; syncPageChrome(); return; }
        const def = firstUnscoredBout();
        const ov = document.createElement('div'); ov.className='ref-overlay';
        ov.innerHTML = `
            <div class="ref-overlay-back" data-close></div>
            <div class="ref-sheet-wrap"><div class="ref-sheet">
                <div class="ref-sheet-head"><span>Record a bout</span><span class="x" data-close>✕</span></div>
                <div class="ref-sheet-body">
                    <div class="bout-picker">
                        <div class="bout-pick-col"><span class="bout-pick-label">Fencer</span><select class="bout-select" id="pick-a"></select></div>
                        <span class="bout-pick-vs">vs</span>
                        <div class="bout-pick-col"><span class="bout-pick-label">Opponent</span><select class="bout-select" id="pick-b"></select></div>
                    </div>
                    <div class="ref-btn-row">
                        <button class="rbtn rbtn-danger" data-close>Cancel</button>
                        <button class="rbtn" id="pick-start">Start timer</button>
                    </div>
                </div>
            </div></div>`;
        const selA=ov.querySelector('#pick-a'), selB=ov.querySelector('#pick-b');
        selA.innerHTML = availableOptions().map(o=>`<option value="${o.i}">${esc(o.name)}</option>`).join('');
        function fillB(){
            const a=+selA.value;
            const prev=selB.value;
            selB.innerHTML = availableOptions().filter(o=> o.i!==a).map(o=>`<option value="${o.i}">${esc(o.name)}</option>`).join('');
            if(def && def.a===a) selB.value=String(def.b);
            else if(prev!=='' && +prev!==a && Array.from(selB.options).some(op=>op.value===prev)) selB.value=prev;
        }
        if(def) selA.value=String(def.a);
        fillB();
        selA.addEventListener('change', fillB);
        ov.querySelector('#pick-start').addEventListener('click', ()=>{
            const a=+selA.value, b=+selB.value;
            if(Number.isNaN(a)||Number.isNaN(b)||a===b){ toast('Pick two fencers', true); return; }
            closeOverlay(ov); openTimer(a,b);
        });
        ov.querySelectorAll('[data-close]').forEach(x=> x.addEventListener('click', ()=>{
            closeOverlay(ov);
            if(!timerEl){ pageMode='pools'; syncPageChrome(); }
        }));
        showOverlay(ov);
    }

    /* --- Step 2: the bout timer (3:00 countdown; 5-touch cap in pools,
       15 in DE). Double Touch scores one for each fencer (épée). --- */
    function openTimer(a,b){
        if(timerEl){ closeTimer(timerEl, true); }
        const fmtCfg = IS_DE ? defaultDEFormat() : POOL_FORMAT;
        timerState = { a, b, sa:0, sb:0, secs:fmtCfg.periodSecs, running:false, tick:null, fmt:fmtCfg, period:1, broke:false, pending:null };
        const ov = document.createElement('div'); ov.className='ref-timer';
        timerEl = ov;
        const nameFor = (slot)=> esc(ROSTER[slot]?rosterLabel(slot):'');
        const topLabel = IS_DE ? deMatchLabel(a,b) : `Pool ${(SESSION.poolIndex||0)+1}`;
        const weaponRow = IS_DE ? `
            <div class="ref-timer-weapon">
                <span class="weap-label">Format</span>
                <div class="weap-seg" id="tweap">
                    ${Object.values(DE_WEAPONS).map(w=>`<button type="button" class="weap-seg-btn${w.key===fmtCfg.key?' active':''}" data-weap="${w.key}">${w.label}</button>`).join('')}
                </div>
            </div>` : '';
        ov.innerHTML = `
            <div class="ref-timer-top"><button type="button" class="rbtn rbtn-danger ref-timer-cancel" data-abort>Cancel</button><span>${esc(topLabel)}</span></div>
            <div class="ref-timer-main">
                <div class="ref-timer-center">
                    <div class="ref-timer-clock" id="tclock">3:00</div>
                    <div class="ref-timer-status" id="tstatus"></div>
                </div>
                <div class="ref-fencers">
                    ${[a,b].map((slot,side)=>`
                        <div class="ref-fencer" id="tfencer-${side}">
                            <div class="ref-fencer-name">${nameFor(slot)}</div>
                            <div class="ref-fencer-score" id="tsc-${side}">0</div>
                            <div class="ref-touch-btns">
                                <button class="touch-btn minus" data-side="${side}" data-d="-1">−</button>
                                <button class="touch-btn plus" data-side="${side}" data-d="1">+</button>
                            </div>
                        </div>`).join('')}
                </div>
            </div>
            <div class="ref-timer-controls">
                <button class="rbtn" id="t-startpause">Start</button>
                <button class="rbtn rbtn-glass" id="t-double" aria-label="Double touch" title="Double touch">DB<small>Double Touch</small></button>
                <div class="ref-timer-under">
                    <button class="rbtn rbtn-glass" id="t-reset" title="Reset timer">Reset</button>
                    <button class="rbtn rbtn-white" id="t-finish">Finish Bout</button>
                </div>
            </div>
            ${weaponRow}`;
        const clock = ov.querySelector('#tclock');
        const statusEl = ov.querySelector('#tstatus');
        const primaryBtn = ov.querySelector('#t-startpause');
        const fmt = (s)=> Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
        function statusText(){
            if(!IS_DE) return 'First to 5';
            if(timerState.pending==='next-period') return `Break — end of period ${timerState.period}`;
            if(timerState.pending==='resume') return `Break at ${timerState.fmt.breakAt} — tap Resume`;
            if(timerState.fmt.breakAt) return `First to 15 · break at ${timerState.fmt.breakAt}`;
            return `Period ${timerState.period} of ${timerState.fmt.periods}`;
        }
        function primaryLabel(){
            if(timerState.pending==='next-period') return 'Next period';
            if(timerState.pending==='resume') return 'Resume';
            return timerState.running ? 'Pause' : 'Start';
        }
        function paint(){
            clock.textContent = fmt(timerState.secs);
            clock.classList.toggle('warn', timerState.secs<=30 && timerState.secs>0);
            clock.classList.toggle('done', timerState.secs===0);
            if(statusEl) statusEl.textContent = statusText();
            if(primaryBtn) primaryBtn.textContent = primaryLabel();
            ov.querySelector('#tsc-0').textContent = timerState.sa;
            ov.querySelector('#tsc-1').textContent = timerState.sb;
            ov.querySelector('#tfencer-0').classList.toggle('is-leading', timerState.sa>timerState.sb);
            ov.querySelector('#tfencer-1').classList.toggle('is-leading', timerState.sb>timerState.sa);
        }
        function stop(){ timerState.running=false; if(timerState.tick){ clearInterval(timerState.tick); timerState.tick=null; } paint(); }
        function start(){ if(timerState.running||timerState.secs<=0) return; timerState.running=true; paint();
            timerState.tick=setInterval(()=>{
                timerState.secs--;
                if(timerState.secs<=0){
                    timerState.secs=0; stop();
                    // Time-based periods (foil/épée): expiring a non-final period
                    // opens the between-period break instead of ending the bout.
                    if(IS_DE && !timerState.fmt.breakAt && timerState.period < timerState.fmt.periods){
                        timerState.pending='next-period';
                    }
                }
                paint();
            }, 1000); }
        function onTouchChanged(){
            const cap=touchCap();
            if(timerState.sa>=cap || timerState.sb>=cap){ stop(); return; }   // bout won
            // Sabre: one break the first time a fencer reaches 8.
            if(IS_DE && timerState.fmt.breakAt && !timerState.broke && Math.max(timerState.sa,timerState.sb) >= timerState.fmt.breakAt){
                stop(); timerState.broke=true; timerState.pending='resume'; paint();
            }
        }
        primaryBtn.addEventListener('click', ()=>{
            if(timerState.pending==='next-period'){ timerState.period++; timerState.secs=timerState.fmt.periodSecs; timerState.pending=null; paint(); return; }
            if(timerState.pending==='resume'){ timerState.pending=null; start(); return; }
            timerState.running ? stop() : start();
        });
        ov.querySelector('#t-reset').addEventListener('click', ()=>{ stop(); timerState.secs=timerState.fmt.periodSecs; timerState.pending=null; paint(); });
        ov.querySelectorAll('.touch-btn').forEach(btn=> btn.addEventListener('click', ()=>{
            const cap=touchCap();
            const side=+btn.dataset.side, d=+btn.dataset.d, key= side===0?'sa':'sb';
            timerState[key]=Math.max(0, Math.min(cap, timerState[key]+d)); paint();
            onTouchChanged();
        }));
        /* Épée double: a plain momentary point button — each tap adds one
           touch to BOTH fencers (capped), exactly like the +1 buttons add one
           to a single fencer. Not a toggle, no special cases. */
        ov.querySelector('#t-double').addEventListener('click', ()=>{
            const cap=touchCap();
            timerState.sa=Math.min(cap, timerState.sa+1);
            timerState.sb=Math.min(cap, timerState.sb+1);
            paint();
            onTouchChanged();
        });
        // Weapon picker (DE): reconfigure the clock/period structure on the fly.
        const weapSeg = ov.querySelector('#tweap');
        if(weapSeg){
            weapSeg.querySelectorAll('.weap-seg-btn').forEach(btn=> btn.addEventListener('click', ()=>{
                const next = DE_WEAPONS[btn.dataset.weap]; if(!next) return;
                stop();
                timerState.fmt = next; timerState.period = 1; timerState.secs = next.periodSecs;
                timerState.broke = false; timerState.pending = null;
                weapSeg.querySelectorAll('.weap-seg-btn').forEach(b=> b.classList.toggle('active', b===btn));
                paint();
            }));
        }
        ov.querySelector('#t-finish').addEventListener('click', ()=>{ stop(); openConfirm(ov, a, b, timerState.sa, timerState.sb); });
        ov.querySelector('[data-abort]').addEventListener('click', ()=>{ stop(); closeTimer(ov); });
        document.body.appendChild(ov);
        pageMode = 'bout';
        requestAnimationFrame(()=>{
            ov.classList.add('open');
            syncPageChrome();
        });
        paint();
    }
    function closeTimer(ov, silent){
        const el = ov || timerEl;
        if(!el) return;
        if(timerState && timerState.tick){ clearInterval(timerState.tick); }
        el.classList.remove('open');
        el.classList.remove('is-parked');
        setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 200);
        if(timerEl === el) timerEl = null;
        timerState = null;
        if(!silent){
            pageMode = 'pools';
            if(stageEl) stageEl.classList.remove('is-hidden');
            syncPageChrome();
        }
    }

    /* --- Step 3: confirm + approve (submits the bout) --- */
    function openConfirm(timerOv, a, b, sa, sb){
        let victor = sa>sb ? a : (sb>sa ? b : null);
        const ov = document.createElement('div'); ov.className='ref-overlay';
        const nameA=esc(ROSTER[a]?rosterLabel(a):''), nameB=esc(ROSTER[b]?rosterLabel(b):'');
        function render(){
            const needPick = victor==null;
            ov.innerHTML = `
                <div class="ref-overlay-back" data-close></div>
                <div class="ref-sheet-wrap"><div class="ref-sheet">
                    <div class="ref-sheet-head"><span>Approve bout</span><span class="x" data-close>✕</span></div>
                    <div class="ref-sheet-body">
                        <div class="confirm-score">
                            <div class="confirm-side ${victor===a?'win':''}"><span>${sa}</span><span class="nm">${nameA}</span></div>
                            <span style="color:var(--text-light);">–</span>
                            <div class="confirm-side ${victor===b?'win':''}"><span>${sb}</span><span class="nm">${nameB}</span></div>
                        </div>
                        ${needPick
                            ? `<div class="confirm-hint">Tied — tap the winner (priority):</div><div class="winner-pick"><button class="rbtn rbtn-ghost" data-win="${a}">${nameA}</button><button class="rbtn rbtn-ghost" data-win="${b}">${nameB}</button></div>`
                            : `<div class="confirm-hint"><strong>${victor===a?nameA:nameB}</strong> wins the bout.${(IS_DE&&sa===sb)?' Priority win — recorded one touch up.':''}</div>`}
                        <div class="ref-btn-row">
                            <button class="rbtn rbtn-ghost" data-back>Back</button>
                            <button class="rbtn rbtn-white" id="confirm-send" ${needPick?'disabled':''}>Approve &amp; send</button>
                        </div>
                    </div>
                </div></div>`;
            ov.querySelectorAll('[data-close],[data-back]').forEach(x=> x.addEventListener('click', ()=> closeOverlay(ov)));
            ov.querySelectorAll('[data-win]').forEach(x=> x.addEventListener('click', ()=>{ victor=+x.dataset.win; render(); }));
            const send=ov.querySelector('#confirm-send');
            if(send) send.addEventListener('click', async ()=>{
                send.disabled=true; send.textContent='Sending…';
                const ok = await submitTimedBout(a,b,sa,sb,victor);
                if(ok){ closeOverlay(ov); closeTimer(timerOv); toast('Bout recorded'); }
                else { send.disabled=false; send.textContent='Approve & send'; }
            });
        }
        render(); showOverlay(ov);
    }

    async function submitTimedBout(a,b,sa,sb,victor){
        /* DE can't record a tie — a priority/sudden-death win carries the
           deciding touch, so the winner goes one up before submitting. */
        if(IS_DE && sa===sb){ if(victor===a) sa+=1; else sb+=1; }
        const A=Math.min(a,b), B=Math.max(a,b);
        const aScore = (A===a)? sa : sb, bScore = (A===a)? sb : sa;
        try{
            await rpc('bout_submit', { p_session_id:SESSION_ID, p_token:TOKEN,
                p_a_slot:A, p_b_slot:B, p_a_score:aScore, p_b_score:bScore, p_victor_slot:victor,
                p_a_signature:'', p_b_signature:'', p_ref_name:(SESSION&&SESSION.referee)||'' });
            if(IS_DE){
                boutMap[A+'-'+B]={ a_slot:A, b_slot:B, a_score:aScore, b_score:bScore, victor_slot:victor };
                renderDE();
            } else {
                const ai=cellInput(a,b), bi=cellInput(b,a);
                if(ai) ai.value=(victor===a && sa<=sb ? 'V':'')+sa;
                if(bi) bi.value=(victor===b && sb<=sa ? 'V':'')+sb;
                recompute(); renderWidgets();
            }
            checkPoolCompletionLock();
            return true;
        }catch(err){ toast('Send failed: '+(err.message||''), true); return false; }
    }

    timerBtn.addEventListener('click', ()=>{
        /* On the bout it goes home, parking the timer rather than ending it —
           the clock, the scores and the period all survive, so coming back to
           the bout resumes exactly where it was left. Cancel is still the way
           to abandon a bout. */
        if(timerEl && pageMode === 'bout'){ setPage('pools'); return; }
        if(timerEl){ setPage('bout'); return; }
        openBoutPicker();
    });
    syncPageChrome();
    load();
})();
</script>
</body>
</html>
